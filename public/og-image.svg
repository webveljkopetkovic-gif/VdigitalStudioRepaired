<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060709" />
      <stop offset="58%" stop-color="#080b08" />
      <stop offset="82%" stop-color="#1f3105" />
      <stop offset="100%" stop-color="#9ce607" stop-opacity="0.75" />
    </linearGradient>
    <radialGradient id="limeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9ce607" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#9ce607" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#060709" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="slatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060709" stop-opacity="0.85" />
      <stop offset="92%" stop-color="#9ce607" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#030405" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Right-side 3D Vertical Ribbed Slats -->
  <g opacity="0.85">
    <rect x="780" y="0" width="60" height="630" fill="url(#slatGrad)" opacity="0.25" />
    <rect x="840" y="0" width="60" height="630" fill="url(#slatGrad)" opacity="0.4" />
    <rect x="900" y="0" width="60" height="630" fill="url(#slatGrad)" opacity="0.55" />
    <rect x="960" y="0" width="60" height="630" fill="url(#slatGrad)" opacity="0.7" />
    <rect x="1020" y="0" width="60" height="630" fill="url(#slatGrad)" opacity="0.85" />
    <rect x="1080" y="0" width="60" height="630" fill="url(#slatGrad)" opacity="0.95" />
    <rect x="1140" y="0" width="60" height="630" fill="url(#slatGrad)" opacity="1" />
  </g>

  <!-- Central Ambient Glow -->
  <circle cx="540" cy="315" r="380" fill="url(#limeGlow)" />

  <!-- Top Left Brand Logotype: VDigital. -->
  <g transform="translate(88, 92)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.5">
      <tspan fill="#9ce607">V</tspan><tspan fill="#ffffff">Digital</tspan><tspan fill="#9ce607">.</tspan>
    </text>
  </g>

  <!-- Main Hero Statement -->
  <g transform="translate(88, 245)">
    <text y="0" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="600" fill="#ffffff" letter-spacing="-2">
      We create striking
    </text>
    <text y="76" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="600" fill="#ffffff" letter-spacing="-2">
      concept and branding
    </text>
    <text y="154" font-family="Georgia, serif" font-style="italic" font-size="68" font-weight="400" fill="#a8f300" letter-spacing="-1">
      that help your business grow fast
    </text>
  </g>

  <!-- Bottom Subtitle -->
  <g transform="translate(88, 548)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#d4d4d8">
      Strategy • Brand Identity • Full-Stack Engineering • High-Converting Video
    </text>
  </g>
</svg>
