<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="limeGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#b6ff00" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#b6ff00" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Pure #0a0a0a Black Background -->
  <rect width="1200" height="630" fill="#0a0a0a" />

  <!-- Subtle Neon Green Glow -->
  <circle cx="600" cy="315" r="420" fill="url(#limeGlow)" />

  <!-- Top Left Brand Logotype: VDigital -->
  <g transform="translate(88, 108)">
    <text font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">
      <tspan fill="#b6ff00">V</tspan><tspan fill="#ffffff">Digital</tspan><tspan fill="#b6ff00">.</tspan>
    </text>
  </g>

  <!-- Hero Line (EN / SR / RU) -->
  <g transform="translate(88, 250)">
    <text y="0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
      Websites, video and marketing
    </text>
    <text y="72" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
      for doctors and coaches
    </text>
    <text y="146" font-family="DejaVu Serif, Georgia, serif" font-style="italic" font-size="56" font-weight="400" fill="#b6ff00" letter-spacing="-0.5">
      — ready in 3 weeks
    </text>
  </g>

  <!-- Multilingual Sub-bar & Domain -->
  <g transform="translate(88, 548)">
    <text font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a3a3a3">
      vdigital.dev  ·  EN / SR / RU  ·  Strategy, Websites, Video &amp; Paid Ads
    </text>
  </g>
</svg>
